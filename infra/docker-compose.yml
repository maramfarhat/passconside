services:
  postgres:
    image: postgres:16-alpine
    container_name: pass-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: passai
      POSTGRES_PASSWORD: passai_dev
      POSTGRES_DB: passai
    ports:
      - "5432:5432"
    volumes:
      - pass_ai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passai -d passai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pass_ai_pg_data:
