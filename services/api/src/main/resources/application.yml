spring:
  application:
    name: pass-ai-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pass:
  ai:
    security:
      # When set, PASS AI / clients must send: Authorization: Bearer <key> on /v1/*
      api-key: ${PASS_AI_API_KEY:}
    inference:
      base-url: ${PASS_AI_INFERENCE_BASE_URL:http://127.0.0.1:30000/v1}
      admin-url: ${PASS_AI_INFERENCE_ADMIN_URL:http://127.0.0.1:30001}
      api-key: ${PASS_AI_INFERENCE_API_KEY:}
      connect-timeout: ${PASS_AI_INFERENCE_CONNECT_TIMEOUT:30s}
      read-timeout: ${PASS_AI_INFERENCE_READ_TIMEOUT:600s}
      default-model: ${PASS_AI_DEFAULT_MODEL:Qwen/Qwen3-Coder-30B-A3B-Instruct}
